name: Test Web App Build

on:
  push:
    branches: [ main, master ] # သင် သုံးထားတဲ့ branch နာမည်
  pull_request:
    branches: [ main, master ]

jobs:
  test-compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Vite Build Test
      run: npm run build # သို့မဟုတ် npx vite build
