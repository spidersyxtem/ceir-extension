name: Build WXT Extension Zip
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Extension Source
        run: npm run build

      - name: Upload Extension Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemur-CEIR-Extension
          path: .output/chrome-mv3
